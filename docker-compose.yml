services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sjhfc
      POSTGRES_PASSWORD: sjhfc_dev_password
      POSTGRES_DB: sjhfc
    ports:
      - "5432:5432"
    volumes:
      - sjhfc-postgres:/var/lib/postgresql/data
volumes:
  sjhfc-postgres:
